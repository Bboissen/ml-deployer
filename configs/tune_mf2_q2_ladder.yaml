# Q2 — fidelity ladder: top-5 at train_sample {full(0), 1.5M, 500k}, 6 era
# folds. Full-row trials FIRST in grid order so they hold 5 nodes from t0
# (~7-12h each at 400-700 rounds); 500k/1.5M fill the other 5 slots.
# Ranking stable across rungs -> freeze winner + full-fidelity score;
# ranking flips -> second-stage HPO at 1M rows (see credit plan Q2).
