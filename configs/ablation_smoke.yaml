# Tiny fleet smoke for the NEW ablation code path: config-driven `features` +
# panel_v2 columns + search mode. Gates the wave-1 ablation spend — if a worker's
# panel_v2 is missing a block column or the feature-union projection is wrong, this
# fails in ~1 min instead of mid-way through the 12-config run.
cpus_per_trial: 4
max_concurrent_trials: 10
metric: mean_pinball
mode: min
num_samples: 2
asha_grace_period: 2
asha_reduction_factor: 3
ray_results_dir: artifacts/ray_results
live_events_path: artifacts/live/trial_events.jsonl
panel_path: /data/tune/panel_v2.parquet
eval_months:
- 2025-03
- 2026-01
fold_shuffle_seed: 20260723
min_train_months: 12
train_sample: 4000
name: mf2_ablation_smoke
save_predictions_dir: /data/tune/oof/mf2_ablation_smoke
# base15 + the tiktok block (exercises the union load + a real block column set)
features:
- f_lis_log
- f_lis_dlog_h
- f_lis_dlog_28
- f_lis_dlog_90
- f_lis_slope_90
- f_lis_logstd_90
- f_lis_obs_90
- f_lis_age_days
- f_fol_log
- f_fol_dlog_28
- f_fol_lis_ratio_log
- f_pop
- f_cm_score
- f_cm_rank_neglog
- f_month
- f_ttp_log
- f_ttp_dlog_28
- f_ttp_present
