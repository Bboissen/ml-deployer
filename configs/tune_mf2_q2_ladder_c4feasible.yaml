# Q2 — fidelity ladder, c-4-FEASIBLE (2026-07-24). Supersedes tune_mf2_q2_ladder.yaml
# for any fleet run on 8 GB c-4 workers.
#
# WHY: the original ladder's train_sample:0 (full-row) and 1_500_000 rungs OOM the
# 8 GB c-4 workers under the 7-alpha reg:quantileerror objective — the worker's
# raylet is SIGTERM'd, the ray node dies and rejoins under a new id, and the trial
# registers ERROR (observed 2026-07-24 on the in-flight Q2: 10/15 trials = every
# train_sample>=1.5M rung failed this way; the 500k rung ran clean). This matches the
# xgboost-quantile-cost finding: full-fidelity multi-quantile is infeasible on 8 GB;
# the fleet must stay bounded. cpus_per_trial=4 on 4-CPU nodes => one trial per node,
# so an OOM kills only its own node, never a sibling 500k trial.
#
# WHAT: a genuine 2-rung fidelity trend that all fits in 8 GB — top-5 configs at
# 250k and 500k (with the 120k HPO screen as the implicit third rung). If ranking is
# stable 120k -> 250k -> 500k, freeze the winner set. The FULL-ROW confirmation the
# original ladder wanted is NOT abandoned — it is relocated to the big-RAM host (.99)
# as an offline re-score of the frozen finalists, where 5M-row multi-quantile fits.
# 10 trials fill 10 nodes with zero OOM churn.
cpus_per_trial: 4
max_concurrent_trials: 10
metric: mean_pinball
mode: min
ray_results_dir: artifacts/ray_results
live_events_path: artifacts/live/trial_events.jsonl
panel_path: /data/tune/panel_h28.parquet
eval_months:
- 2022-04
- 2023-01
- 2023-10
- 2024-07
- 2025-04
- 2026-01
fold_shuffle_seed: 20260723
min_train_months: 12
train_sample: 120000
name: mf2_q2_ladder_c4feasible
save_predictions_dir: /data/tune/oof/q2_ladder_c4feasible
fixed_trials:
