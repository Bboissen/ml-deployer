# Q1b — seed-noise band re-measured at 500k on the panel_v2 substrate + the
# PRE-REGISTERED v2 fold set. This is the band the Stage-2 ablation deltas are read
# against, so it MUST share the ablation's panel (panel_v2) and folds — NOT the
# panel_h28 era folds (panel_v2 starts 2023-01; 2022-04 does not exist there).
#
# Senior ruling (SENIOR_REVIEW_MORNING §2): re-measure at 500k as the FIRST fleet
# job; no ablation delta is read before this band exists. Configs t1 (tracked
# finalist, §5a) AND t3 (500k-rung leader, the config the senior named) x 5 seeds =
# 10 trials. Feature set = the 15 incumbents (the ablation's null model). Per-fold
# OOF is saved so the OOT-block-only band (the promotion surface) is derivable.
cpus_per_trial: 4
max_concurrent_trials: 10
metric: mean_pinball
mode: min
ray_results_dir: artifacts/ray_results
live_events_path: artifacts/live/trial_events.jsonl
panel_path: /data/tune/panel_v2.parquet
# Pre-registered v2 fold set: confirmatory {2024-07,2024-11,2025-03} + the recent
# OOT promotion block 2025-07..2026-04 (10 contiguous months).
eval_months:
- 2024-07
- 2024-11
- 2025-03
- 2025-07
- 2025-08
- 2025-09
- 2025-10
- 2025-11
- 2025-12
- 2026-01
- 2026-02
- 2026-03
- 2026-04
fold_shuffle_seed: 20260723
min_train_months: 12
train_sample: 500000
name: mf2_q1b_band500k
save_predictions_dir: /data/tune/oof/q1b_band500k
fixed_trials:
