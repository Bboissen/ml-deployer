<svg xmlns="http://www.w3.org/2000/svg" width="640" height="628" viewBox="0 0 640 628" role="img" aria-labelledby="title description">
  <title id="title">The deployer connects your data, code and results</title>
  <desc id="description">The deployer uploads your selected dataset to S3 or reuses verified versions. EC2 clones your pinned GitHub commit and copies S3 inputs into local DATA_DIR. Your code runs as a non-root user and writes to OUTPUT_DIR. The deployer uploads declared outputs, logs and a receipt to S3 and verifies them. S3 access permissions are configured automatically.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .label { font-size: 22px; font-weight: 600; }
    .detail { font-size: 20px; fill: #334155; }
    .code { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 18px; fill: #334155; }
    .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="640" height="628" rx="12" fill="#ffffff"/>
  <rect x="24" y="16" width="280" height="92" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="label" x="44" y="52">Your dataset</text>
  <text class="detail" x="44" y="84">Local, S3 or HTTPS</text>
  <path class="flow" d="M 164 108 V 172"/>
  <text class="detail" x="184" y="148">Upload</text>
  <rect x="24" y="176" width="280" height="100" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="label" x="44" y="213">S3 dataset</text>
  <text class="detail" x="44" y="246">Verified; reused across runs</text>
  <rect x="336" y="176" width="280" height="100" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="label" x="356" y="213">GitHub repository</text>
  <text class="detail" x="356" y="246">Pinned commit</text>
  <path class="flow" d="M 164 276 V 358"/>
  <text class="detail" x="44" y="307">Copy to local</text>
  <text class="code" x="44" y="334">DATA_DIR</text>
  <path class="flow" d="M 476 276 V 358"/>
  <text class="detail" x="496" y="320">Clone</text>
  <rect x="24" y="362" width="592" height="108" rx="8" fill="#f0fdf4" stroke="#86b89a"/>
  <text class="label" x="44" y="395">EC2 workspace</text>
  <text class="detail" x="44" y="425">Non-root user; S3 permissions set up for you</text>
  <text class="code" x="44" y="454">make setup / make train</text>
  <path class="flow" d="M 320 470 V 534"/>
  <text class="detail" x="340" y="496">Upload from</text>
  <text class="code" x="340" y="522">OUTPUT_DIR</text>
  <rect x="24" y="538" width="592" height="74" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="label" x="44" y="568">S3 results</text>
  <text class="detail" x="44" y="596">Outputs, logs and receipt—saved and verified</text>
</svg>
