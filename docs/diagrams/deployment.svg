<svg xmlns="http://www.w3.org/2000/svg" width="900" height="476" viewBox="0 0 900 476" role="img" aria-labelledby="title description">
  <title id="title">From setup to a finished AWS job</title>
  <desc id="description">On your host: configure tools and sign in, check access, then approve the account, commit, data, size, cost and lifetime. In AWS: prepare storage, network, permissions and expiry guard; verify data and arm expiry before launching EC2; run setup and training, verify saved outputs, then remove compute.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .heading { font-size: 20px; font-weight: 600; }
    .label { font-size: 18px; font-weight: 600; }
    .detail { font-size: 17px; fill: #334155; }
    .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="900" height="476" rx="12" fill="#ffffff"/>
  <rect x="12" y="12" width="876" height="196" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="heading" x="32" y="45">On your host</text>
  <g fill="#ffffff" stroke="#93c5fd">
    <rect x="32" y="66" width="260" height="120" rx="8"/>
    <rect x="320" y="66" width="260" height="120" rx="8"/>
    <rect x="608" y="66" width="260" height="120" rx="8"/>
  </g>
  <text class="label" x="48" y="96">1. Configure</text>
  <text class="detail" x="48" y="127">Install tools, save settings</text>
  <text class="detail" x="48" y="152">and sign in</text>
  <text class="label" x="336" y="96">2. Check access</text>
  <text class="detail" x="336" y="127">Verify tools, AWS identity</text>
  <text class="detail" x="336" y="152">and GitHub access</text>
  <text class="label" x="624" y="96">3. Review and approve</text>
  <text class="detail" x="624" y="127">Account, commit, data, size,</text>
  <text class="detail" x="624" y="152">cost and lifetime</text>
  <path class="flow" d="M 292 126 H 317"/>
  <path class="flow" d="M 580 126 H 605"/>
  <path class="flow" d="M 738 186 V 238 H 162 V 265"/>
  <rect x="370" y="222" width="160" height="32" rx="6" fill="#ffffff"/>
  <text class="detail" x="450" y="244" text-anchor="middle">Type deploy</text>
  <rect x="12" y="268" width="876" height="196" rx="10" fill="#f0fdf4" stroke="#86b89a"/>
  <text class="heading" x="32" y="301">In your AWS account</text>
  <g fill="#ffffff" stroke="#86b89a">
    <rect x="32" y="332" width="260" height="110" rx="8"/>
    <rect x="320" y="332" width="260" height="110" rx="8"/>
    <rect x="608" y="332" width="260" height="110" rx="8"/>
  </g>
  <text class="label" x="48" y="362">4. Prepare AWS</text>
  <text class="detail" x="48" y="393">Buckets, network,</text>
  <text class="detail" x="48" y="418">permissions and expiry guard</text>
  <text class="label" x="336" y="362">5. Launch</text>
  <text class="detail" x="336" y="393">Verify data, arm expiry,</text>
  <text class="detail" x="336" y="418">then start EC2</text>
  <text class="label" x="624" y="362">6. Run and clean up</text>
  <text class="detail" x="624" y="393">Setup, train, verify outputs,</text>
  <text class="detail" x="624" y="418">then remove compute</text>
  <path class="flow" d="M 292 387 H 317"/>
  <path class="flow" d="M 580 387 H 605"/>
</svg>
