<svg xmlns="http://www.w3.org/2000/svg" width="640" height="792" viewBox="0 0 640 792" role="img" aria-labelledby="title description">
  <title id="title">From setup to saved results</title>
  <desc id="description">On your host: configure, check access and approve the reviewed deployment. The deployer then uploads or reuses the dataset in S3, configures EC2 access, arms expiry, launches EC2, and stages local inputs. After setup and training, it uploads and verifies results before removing compute.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .heading, .label { font-size: 22px; font-weight: 600; }
    .detail { font-size: 19px; fill: #334155; }
    .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="640" height="792" rx="12" fill="#ffffff"/>
  <rect x="8" y="8" width="624" height="340" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="heading" x="28" y="42">On your host</text>
  <g fill="#ffffff" stroke="#93c5fd">
    <rect x="28" y="60" width="584" height="78" rx="8"/>
    <rect x="28" y="154" width="584" height="78" rx="8"/>
    <rect x="28" y="248" width="584" height="78" rx="8"/>
  </g>
  <text class="label" x="48" y="88">1. Configure</text>
  <text class="detail" x="48" y="118">Install tools, choose your repo and dataset, sign in</text>
  <text class="label" x="48" y="182">2. Check access</text>
  <text class="detail" x="48" y="212">Verify tools, AWS identity and GitHub access</text>
  <text class="label" x="48" y="276">3. Review and approve</text>
  <text class="detail" x="48" y="306">Account, commit, data, machine, cost and lifetime</text>
  <path class="flow" d="M 320 138 V 151"/>
  <path class="flow" d="M 320 232 V 245"/>
  <path class="flow" d="M 320 348 V 410"/>
  <text class="detail" x="338" y="384">Type deploy</text>
  <rect x="8" y="414" width="624" height="370" rx="10" fill="#f0fdf4" stroke="#86b89a"/>
  <text class="heading" x="28" y="448">The deployer handles AWS</text>
  <g fill="#ffffff" stroke="#86b89a">
    <rect x="28" y="466" width="584" height="84" rx="8"/>
    <rect x="28" y="568" width="584" height="84" rx="8"/>
    <rect x="28" y="670" width="584" height="92" rx="8"/>
  </g>
  <text class="label" x="48" y="494">4. Store your dataset in S3</text>
  <text class="detail" x="48" y="524">Upload or reuse data; set up EC2 access to S3</text>
  <text class="label" x="48" y="596">5. Launch EC2</text>
  <text class="detail" x="48" y="626">Arm expiry; launch EC2 and stage data in DATA_DIR</text>
  <text class="label" x="48" y="698">6. Run and save results</text>
  <text class="detail" x="48" y="728">Run setup and training; upload outputs and logs.</text>
  <text class="detail" x="48" y="751">Verify results, then remove EC2.</text>
  <path class="flow" d="M 320 550 V 565"/>
  <path class="flow" d="M 320 652 V 667"/>
</svg>
